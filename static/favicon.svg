      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Background Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brandGrad)"/>

